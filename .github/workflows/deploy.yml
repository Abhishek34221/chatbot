name: Build and Deploy to EC2

on:
  push:
    branches: [ main ] # Change to 'master' if your default branch is master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/your-app-name:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull the latest image from Docker Hub
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/your-app-name:latest

            # Stop and remove the old container if it exists
            sudo docker stop my-running-app || true
            sudo docker rm my-running-app || true

            # Run the new container (change port mapping as needed, e.g., 80:3000)
            sudo docker run -d --name my-running-app -p 80:3000 ${{ secrets.DOCKERHUB_USERNAME }}/your-app-name:latest