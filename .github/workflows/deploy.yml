name: Build and Deploy Backend to EC2

on:
  push:
    branches: [ main ] # Change to 'master' if your default branch is master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: abhi23631/multi-agent-rag-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull the latest image from Docker Hub
            sudo docker pull abhi23631/multi-agent-rag-backend:latest

            # Stop and remove the old container if it exists
            sudo docker stop multi-agent-backend || true
            sudo docker rm multi-agent-backend || true

            # Run the new container (Mapping port 8000. Change if your app runs on a different port)
            sudo docker run -d --name multi-agent-backend -p 8000:8000 abhi23631/multi-agent-rag-backend:latest